name: Vérifications

on:
  pull_request:
  workflow_call:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit anti-slop (DESIGN.md)
        run: npm run audit
      - name: Typage et build
        run: npm run build
      - name: Budget JS
        run: npm run budget
      - name: Navigateur de test
        run: npx playwright install --with-deps chromium
      - name: Tests Playwright (bureau et mobile)
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: rapport-playwright
          path: test-results/
          retention-days: 7
