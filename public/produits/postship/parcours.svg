<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 180" width="860" height="180" role="img" aria-label="Un parcours de paiement en trois étapes, jouées dans l'ordre ; la troisième a cassé.">
<rect x="40" y="40" width="240" height="70" rx="6" fill="none" stroke="#4a9e70" stroke-width="1.5"/>
<circle cx="62" cy="62" r="7" fill="#4a9e70"/><path d="M 59 62 L 61 64.2 L 65.2 59.6" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="78" y="66" font-size="13" fill="#ededed" text-anchor="start" font-weight="500" style="font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace">/tarifs</text>
<text x="78" y="88" font-size="12" fill="#a1a1a1" text-anchor="start" font-weight="normal" style="font-family:Onest,system-ui,sans-serif">le bouton « Choisir Pro »</text>
<text x="160" y="130" font-size="12" fill="#a1a1a1" text-anchor="middle" font-weight="normal" style="font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace">étape 1</text>
<path d="M 280 75 L 320 75" stroke="#868686" stroke-width="1.5"/><path d="M 312 69 L 320 75 L 312 81" fill="none" stroke="#868686" stroke-width="1.5"/>
<rect x="320" y="40" width="240" height="70" rx="6" fill="none" stroke="#4a9e70" stroke-width="1.5"/>
<circle cx="342" cy="62" r="7" fill="#4a9e70"/><path d="M 339 62 L 341 64.2 L 345.2 59.6" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="358" y="66" font-size="13" fill="#ededed" text-anchor="start" font-weight="500" style="font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace">/checkout</text>
<text x="358" y="88" font-size="12" fill="#a1a1a1" text-anchor="start" font-weight="normal" style="font-family:Onest,system-ui,sans-serif">le formulaire, Stripe.js</text>
<text x="440" y="130" font-size="12" fill="#a1a1a1" text-anchor="middle" font-weight="normal" style="font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace">étape 2</text>
<path d="M 560 75 L 600 75" stroke="#868686" stroke-width="1.5"/><path d="M 592 69 L 600 75 L 592 81" fill="none" stroke="#868686" stroke-width="1.5"/>
<rect x="600" y="40" width="240" height="70" rx="6" fill="none" stroke="#d9635a" stroke-width="1.5"/>
<circle cx="622" cy="62" r="7" fill="#d9635a"/><path d="M 619.4 59.4 L 624.6 64.6 M 624.6 59.4 L 619.4 64.6" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round"/>
<text x="638" y="66" font-size="13" fill="#ededed" text-anchor="start" font-weight="500" style="font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace">/merci</text>
<text x="638" y="88" font-size="12" fill="#a1a1a1" text-anchor="start" font-weight="normal" style="font-family:Onest,system-ui,sans-serif">la confirmation</text>
<text x="720" y="130" font-size="12" fill="#a1a1a1" text-anchor="middle" font-weight="normal" style="font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace">étape 3</text>
<text x="430" y="165" font-size="12" fill="#a1a1a1" text-anchor="middle" font-weight="normal" style="font-family:Onest,system-ui,sans-serif">Chaque étape ouvre la suivante, comme un client. PostShip s'arrête à la première qui casse — et vous dit laquelle.</text>
