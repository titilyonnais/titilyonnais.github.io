<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="860" height="200" role="img" aria-label="L'alerte arrive sur le téléphone et sur le salon, en un seul message ; quand tout passe, rien ne part.">
<rect x="40" y="20" width="200" height="160" rx="6" fill="none" stroke="#868686" stroke-width="1.5"/>
<rect x="100" y="28" width="80" height="6" rx="3" fill="#868686"/>
<rect x="52" y="50" width="176" height="62" rx="6" fill="rgba(237,237,237,0.06)" stroke="#868686" stroke-width="1.5"/>
<circle cx="68" cy="66" r="6" fill="#8fb0dc"/>
<text x="80" y="70" font-size="12" fill="#a1a1a1" text-anchor="start" font-weight="normal" style="font-family:Onest,system-ui,sans-serif">PostShip · maintenant</text>
<text x="62" y="88" font-size="12" fill="#ededed" text-anchor="start" font-weight="500" style="font-family:Onest,system-ui,sans-serif">Acme — 1 URL en échec</text>
<text x="62" y="102" font-size="12" fill="#a1a1a1" text-anchor="start" font-weight="normal" style="font-family:Onest,system-ui,sans-serif">/checkout : bouton absent</text>
<text x="140" y="150" font-size="12" fill="#a1a1a1" text-anchor="middle" font-weight="normal" style="font-family:Onest,system-ui,sans-serif">Le téléphone</text>
<rect x="290" y="20" width="300" height="160" rx="6" fill="none" stroke="#868686" stroke-width="1.5"/>
<text x="310" y="44" font-size="12" fill="#a1a1a1" text-anchor="start" font-weight="normal" style="font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace">#deploys · Slack</text>
<circle cx="320" cy="72" r="4" fill="#d9635a"/>
<text x="332" y="76" font-size="12" fill="#ededed" text-anchor="start" font-weight="500" style="font-family:Onest,system-ui,sans-serif">acme — 1 en échec, 0 rétabli</text>
<text x="332" y="94" font-size="12" fill="#a1a1a1" text-anchor="start" font-weight="normal" style="font-family:Onest,system-ui,sans-serif">après le déploiement 4f2a9c1 · il y a 12 s</text>
<text x="332" y="116" font-size="12" fill="#d9635a" text-anchor="start" font-weight="normal" style="font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace">/checkout — bouton « Payer » absent</text>
<text x="332" y="134" font-size="12" fill="#a1a1a1" text-anchor="start" font-weight="normal" style="font-family:Onest,system-ui,sans-serif">Cause probable : ce déploiement (+80)</text>
<text x="332" y="160" font-size="12" fill="#a1a1a1" text-anchor="start" font-weight="normal" style="font-family:Onest,system-ui,sans-serif">Un seul message pour tout le déploiement.</text>
<rect x="640" y="20" width="190" height="160" rx="6" fill="none" stroke="#868686" stroke-width="1.5"/>
<text x="660" y="44" font-size="12" fill="#a1a1a1" text-anchor="start" font-weight="normal" style="font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace">Et si tout passe</text>
<text x="660" y="90" font-size="28" fill="#868686" text-anchor="start" font-weight="normal" style="font-family:Onest,system-ui,sans-serif">—</text>
<text x="660" y="118" font-size="12" fill="#ededed" text-anchor="start" font-weight="normal" style="font-family:Onest,system-ui,sans-serif">Rien. Le silence,</text>
<text x="660" y="134" font-size="12" fill="#ededed" text-anchor="start" font-weight="normal" style="font-family:Onest,system-ui,sans-serif">c'est le but.</text>
</svg>
